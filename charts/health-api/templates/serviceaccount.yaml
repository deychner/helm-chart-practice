{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "health-api.serviceAccountName" . }}
  namespace: {{ include "health-api.namespace" . }}
  labels:
    {{- include "health-api.labels" . | nindent 4 }}
{{/*
Off by default. Our app never calls the Kubernetes API, so mounting a token
into the pod only creates something for an attacker to steal. Flip this to
true and `kubectl exec` into the pod to watch the token appear under
/var/run/secrets/kubernetes.io/serviceaccount.
*/}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
